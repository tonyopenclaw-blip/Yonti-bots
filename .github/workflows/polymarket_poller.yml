name: Polymarket Poller

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Manual trigger for testing

permissions:
  contents: write
  pull-requests: write

env:
  POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  CLOB_API_URL: 'https://clob.polymarket.com'
  CHAIN: 'polygon'
  MARKET_TYPE: 'pf'

jobs:
  poll-polymarket:
    name: Poll Crypto Markets
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 1: Fetch market list from CLOB ──────────────────────────────────
      - name: Fetch Polymarket CLOB markets
        id: fetch-markets
        run: |
          set -euo pipefail

          # Retry logic for transient failures
          fetch_with_retry() {
            local attempt=1
            local max_attempts=3
            local delay=10
            while [[ $attempt -le $max_attempts ]]; do
              echo "Attempt $attempt/$max_attempts..."
              response=$(curl -s -w "\n%{http_code}" \
                --max-time 30 \
                -H "Authorization: Bearer ${POLYMARKET_API_KEY}" \
                -H "Accept: application/json" \
                "${CLOB_API_URL}/markets?chain=${CHAIN}&market_type=${MARKET_TYPE}&limit=50" \
                2>&1)
              
              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              
              if [[ "$http_code" == "200" ]]; then
                echo "$body"
                return 0
              elif [[ "$http_code" == "429" ]]; then
                echo "Rate limited. Sleeping ${delay}s before retry..."
                sleep $delay
                delay=$((delay * 2))
                attempt=$((attempt + 1))
              else
                echo "HTTP $http_code — attempt $attempt failed."
                if [[ $attempt -lt $max_attempts ]]; then
                  sleep $delay
                  delay=$((delay * 2))
                  attempt=$((attempt + 1))
                else
                  echo "Max attempts reached. Failing."
                  echo "body=$body"
                  exit 1
                fi
              fi
            done
          }

          echo "::group::Polymarket API Response"
          MARKETS_JSON=$(fetch_with_retry)
          echo "::endgroup::"

          if [[ -z "$MARKETS_JSON" ]]; then
            echo "ERROR: Empty response from Polymarket"
            exit 1
          fi

          echo "markets_json<<EOF" >> $GITHUB_OUTPUT
          $MARKETS_JSON
          EOF

      # ── Step 2: Parse and filter BTC / crypto 5-min markets ─────────────────
      - name: Extract live crypto market data
        id: extract-data
        run: |
          set -euo pipefail

          MARKETS_JSON='${{ steps.fetch-markets.outputs.markets_json }}'

          if [[ -z "$MARKETS_JSON" || "$MARKETS_JSON" == "null" || "$MARKETS_JSON" == "{}" ]]; then
            echo "WARNING: No markets returned. Posting heartbeat only."
            echo "is_empty=true" >> $GITHUB_OUTPUT
            echo "discord_payload={}" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "is_empty=false" >> $GITHUB_OUTPUT

          # Use jq to extract BTC 5-min and active crypto markets
          # Filter: BTC-related or 5-min timeframe, active (closed = false)
          EXTRACTED=$(echo "$MARKETS_JSON" | jq '[
            .markets[]? |
            select(
              (
                (.question | test("btc|bitcoin|₿"; "i")) or
                (.question | test("eth|ethereum"; "i")) or
                (.question | test("5.min|5min|5 min"; "i"))
              ) and
              (.closed == false or .closed == null)
            ) |
            {
              id: .id,
              question: .question,
              condition_id: .condition_id,
              market_type: .market_type,
              slug: .slug,
              clob_url: .clob_url,
              # Best bid/ask or spread
              best_bid: (.best_bid // null),
              best_ask: (.best_ask // null),
              spread: (if (.best_bid != null and .best_ask != null) then ((.best_ask | tonumber) - (.best_bid | tonumber)) else null end),
              # Price (from outcomes / neg_risk)
              outcome_prices: (.outcome_prices // null),
              # Volume
              volume: (.volume // null),
              # Updated
              updated_at: (.updated_at // now | todate)
            }
          ]')

          echo "extracted_json<<EOF" >> $GITHUB_OUTPUT
          $EXTRACTED
          EOF

          # Build compact Discord embed payload
          COUNT=$(echo "$EXTRACTED" | jq 'length')
          echo "market_count=$COUNT" >> $GITHUB_OUTPUT

          if [[ "$COUNT" -gt 0 ]]; then
            DISCORD_EMBEDS=$(echo "$EXTRACTED" | jq -c '.[]' | while read -r item; do
              QUESTION=$(echo "$item" | jq -r '.question')
              COND_ID=$(echo "$item" | jq -r '.condition_id')
              BEST_BID=$(echo "$item" | jq -r '.best_bid // "N/A"')
              BEST_ASK=$(echo "$item" | jq -r '.best_ask // "N/A"')
              SPREAD=$(echo "$item" | jq -r '.spread // "N/A"')
              VOLUME=$(echo "$item" | jq -r '.volume // "N/A"')
              URL=$(echo "$item" | jq -r '.clob_url // "https://polymarket.com"')

              # Escape double-quotes for JSON string
              QUESTION_ESC=$(echo "$QUESTION" | jq -Rs '.' | cut -d'"' -f2 | sed 's/"/\\"/g')

              echo '{"title":"'"$QUESTION_ESC"'","color":3066993,"fields":[{"name":"Condition ID","value":"'"$COND_ID"'","inline":true},{"name":"Best Bid","value":"'"$BEST_BID"'","inline":true},{"name":"Best Ask","value":"'"$BEST_ASK"'","inline":true},{"name":"Spread","value":"'"$SPREAD"'","inline":true},{"name":"Volume","value":"'"$VOLUME"'","inline":true}],"url":"'"$URL"'","footer":{"text":"Polymarket Poller"}}'
            done | jq -s '.')

            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            DISCORD_PAYLOAD=$(jq -n \
              --argjson embeds "$DISCORD_EMBEDS" \
              --arg ts "$TIMESTAMP" \
              --arg count "$COUNT" \
              '{
                username: "Polymarket Poller",
                avatar_url: "https://i.imgur.com/AfFp7pu.png",
                content: "** Polymarket Crypto Markets Update — '"$count"' markets**",
                embeds: $embeds,
                timestamp: $ts
              }')
          else
            DISCORD_PAYLOAD=$(jq -n \
              --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '{
                username: "Polymarket Poller",
                content: " Polymarket Poller heartbeat — no active BTC/crypto 5-min markets found.",
                timestamp: $ts
              }')
          fi

          echo "discord_payload<<EOF" >> $GITHUB_OUTPUT
          $DISCORD_PAYLOAD
          EOF

      # ── Step 3: Save live_markets.json and commit ────────────────────────────
      - name: Save and commit live markets data
        run: |
          set -euo pipefail

          mkdir -p workers/data

          if [[ '${{ steps.extract-data.outputs.is_empty }}' == "false" ]]; then
            # Merge with existing live_markets.json, updating timestamp
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            
            if [[ -f workers/data/live_markets.json ]] && [[ -s workers/data/live_markets.json ]]; then
              EXISTING=$(cat workers/data/live_markets.json)
            else
              EXISTING="{}"
            fi

            # Build new JSON with markets array + metadata
            UPDATED=$(echo '{}' | jq \
              --argjson existing "$EXISTING" \
              --argjson markets '${{ steps.extract-data.outputs.extracted_json }}' \
              --arg ts "$TIMESTAMP" \
              --arg count '${{ steps.extract-data.outputs.market_count }}' \
              '{
                updated_at: $ts,
                run_id: env.GITHUB_RUN_ID,
                run_url: "https://github.com/\(env.GITHUB_REPOSITORY)/actions/runs/\(env.GITHUB_RUN_ID)",
                market_count: ($count | tonumber),
                markets: $markets
              }')

            echo "$UPDATED" > workers/data/live_markets.json
          else
            # Heartbeat only — update timestamp in existing file
            if [[ -f workers/data/live_markets.json ]]; then
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              cat workers/data/live_markets.json | jq \
                --arg ts "$TIMESTAMP" \
                '.updated_at = $ts | .run_id = env.GITHUB_RUN_ID | .heartbeat = true' \
                > workers/data/live_markets.json.tmp && mv workers/data/live_markets.json.tmp workers/data/live_markets.json
            else
              echo '{"updated_at":"'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'","heartbeat":true}' > workers/data/live_markets.json
            fi
          fi

          echo "::group::live_markets.json"
          cat workers/data/live_markets.json | jq .
          echo "::endgroup::"

          git config --local user.email "polymarket-poller@github-actions.bot"
          git config --local user.name "Polymarket Poller Bot"
          git add workers/data/live_markets.json
          git diff --cached --stat
          git commit -m "chore: update live_markets.json [skip ci] [polymarket-poller]" || echo "No changes to commit"

          # Try to push; fail gracefully if nothing changed
          git push origin HEAD || echo "Push failed (possibly no changes to commit — OK)"

      # ── Step 4: Post to Discord webhook ─────────────────────────────────────
      - name: Post to Discord webhook
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK}" ]]; then
            echo "WARNING: DISCORD_WEBHOOK not set. Skipping Discord notification."
            exit 0
          fi

          DISCORD_PAYLOAD='${{ steps.extract-data.outputs.discord_payload }}'

          if [[ -z "$DISCORD_PAYLOAD" || "$DISCORD_PAYLOAD" == "{}" ]]; then
            echo "Empty Discord payload — posting heartbeat."
            DISCORD_PAYLOAD=$(jq -n \
              --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{
                username: "Polymarket Poller",
                content: " Polymarket Poller heartbeat — API unreachable or empty response. Check run: \(env.GITHUB_SERVER_URL)/\($GITHUB_REPOSITORY)/actions/runs/\($GITHUB_RUN_ID)",
                timestamp: $ts
              }')
          fi

          echo "::group::Discord Payload"
          echo "$DISCORD_PAYLOAD" | jq .
          echo "::endgroup::"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$DISCORD_PAYLOAD" \
            "${DISCORD_WEBHOOK}")

          echo "Discord webhook HTTP response: $HTTP_CODE"

          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
            echo "Discord notification sent successfully."
          else
            echo "WARNING: Discord webhook returned HTTP $HTTP_CODE"
          fi

      # ── Step 5: Summary output ──────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## Polymarket Poller Run" >> $GITHUB_STEP_SUMMARY
          echo "- Run ID: $GITHUB_RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "- Markets fetched: ${{ steps.extract-data.outputs.market_count || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- Empty/heartbeat: ${{ steps.extract-data.outputs.is_empty || true }}" >> $GITHUB_STEP_SUMMARY
          echo "- [View live_markets.json](https://github.com/$GITHUB_REPOSITORY/blob/main/workers/data/live_markets.json)" >> $GITHUB_STEP_SUMMARY
