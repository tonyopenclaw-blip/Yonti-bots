name: Polymarket Poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch market data
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request
          
          api_key = os.environ.get('POLYMARKET_API_KEY', '')
          if not api_key:
              print("No API key found")
              with open('markets_raw.json', 'w') as f:
                  f.write('{"error": "no_api_key"}')
              exit(0)
          
          try:
              req = urllib.request.Request(
                  'https://clob.polymarket.com/markets?chain=polygon&market_type=pf&limit=50',
                  headers={'Authorization': f'Bearer {api_key}', 'Accept': 'application/json'}
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read())
                  with open('markets_raw.json', 'w') as f:
                      json.dump(data, f)
                  print(f"Fetched {len(data)} items")
          except Exception as e:
              print(f"Error: {e}")
              with open('markets_raw.json', 'w') as f:
                  f.write('{"error": "' + str(e) + '"}')
          PYEOF

      - name: Process market data
        run: |
          python3 << 'PYEOF'
          import json, os
          
          try:
              with open('markets_raw.json') as f:
                  raw = f.read()
              
              if not raw.strip() or '"error"' in raw:
                  print("Empty or error response")
                  with open('markets_processed.json', 'w') as f:
                      json.dump([], f)
                  exit(0)
              
              data = json.loads(raw)
              
              # Handle the response format: {"data": [...]} or [...]
              if isinstance(data, dict) and 'data' in data:
                  markets = data['data']
              elif isinstance(data, list):
                  markets = data
              else:
                  print(f"Unknown format: {type(data)}")
                  markets = []
              
              filtered = []
              for m in markets:
                  q = m.get('question', '') or ''
                  closed = m.get('closed', True)
                  active = m.get('active', False)
                  if closed or not active:
                      continue
                  
                  crypto = any(k in q.lower() for k in 
                      ['btc', 'bitcoin', 'eth', 'ethereum', 'sol', 'solana', 'xrp', 'doge', 'bnb', 'hype'])
                  timeframe = any(k in q.lower() for k in 
                      ['5 min', '5min', '5.min', '5m'])
                  
                  if crypto or timeframe:
                      bid = m.get('best_bid')
                      ask = m.get('best_ask')
                      spread = None
                      if bid and ask:
                          try:
                              spread = round(float(ask) - float(bid), 4)
                          except:
                              pass
                      
                      filtered.append({
                          'id': m.get('id', ''),
                          'question': q[:100],
                          'condition_id': m.get('condition_id', ''),
                          'slug': m.get('slug', ''),
                          'clob_url': m.get('clob_url', ''),
                          'best_bid': str(bid) if bid else None,
                          'best_ask': str(ask) if ask else None,
                          'spread': spread,
                          'volume': m.get('volume'),
                          'active': active,
                          'closed': closed,
                      })
              
              print(f"Found {len(filtered)} active crypto/5min markets")
              
              with open('markets_processed.json', 'w') as f:
                  json.dump(filtered, f, indent=2)
              
          except Exception as e:
              print(f"Error: {e}")
              import traceback
              traceback.print_exc()
              with open('markets_processed.json', 'w') as f:
                  json.dump([], f)
          PYEOF

      - name: Save market data
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os
          
          with open('markets_processed.json') as f:
              markets = json.load(f)
          
      - name: Save and commit
        run: |
          mkdir -p workers/data
          python3 -c "
          import json, subprocess, os
          with open('markets_processed.json') as f:
              markets = json.load(f)
          import datetime
          ts = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          data = {
              'updated_at': ts,
              'market_count': len(markets),
              'markets': markets
          }
          with open('workers/data/live_markets.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(f'Saved {len(markets)} markets')
          "
          
          git config --local user.email "polymarket-poller@github-actions.bot"
          git config --local user.name "Polymarket Poller Bot"
          git add workers/data/live_markets.json || true
          if git diff --cached --quiet; then
              echo "No changes to commit"
          else
              git commit -m "chore: update live_markets.json [skip ci]" || true
              git push origin main || echo "Push failed"
          fi

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK != ''
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, datetime
          
          with open('markets_processed.json') as f:
              markets = json.load(f)
          
          webhook = os.environ.get('DISCORD_WEBHOOK', '')
          if not webhook:
              print("No webhook")
              exit(0)
          
          ts = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          
          if not markets:
              content = "🤖 Polymarket Poller heartbeat — no active BTC/crypto 5-min markets right now."
          else:
              lines = []
              for m in markets[:8]:
                  bid = m.get('best_bid', '?')
                  ask = m.get('best_ask', '?')
                  spread = m.get('spread')
                  spread_str = f"${spread:.4f}" if spread else '?'
                  lines.append(f"**{m['question']}**\nBid: `${bid}` | Ask: `${ask}` | Spread: `{spread_str}`")
              
              content = f"** Polymarket — {len(markets)} active BTC/crypto markets**\n\n" + "\n\n".join(lines)
          
          payload = {
              "username": "Polymarket Poller",
              "content": content,
              "timestamp": ts
          }
          
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Discord: {resp.status}")
          except Exception as e:
              print(f"Discord error: {e}")
          PYEOF
