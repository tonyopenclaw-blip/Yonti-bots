<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superbot Paper Trading Report — REEVAL v1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            color: #58a6ff;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }
        .stat-card .label {
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
        .positive { color: #3fb950; }
        .negative { color: #f85149; }
        .neutral { color: #58a6ff; }
        .trades-table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border-radius: 8px;
            overflow: hidden;
        }
        .trades-table th, .trades-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }
        .trades-table th {
            background: #21262d;
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
        }
        .trades-table tr:hover {
            background: #1c2128;
        }
        .session-info {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Superbot Paper Trading Report — REEVAL v1 📊</h1>
        <div class="session-info">
            Session: 2026-04-09 23:31:53 UTC to 2026-04-09 23:32:24 UTC
        </div>
        
        <div class="summary">
            <div class="stat-card">
                <div class="label">Starting Balance</div>
                <div class="value neutral">$34.67</div>
            </div>
            <div class="stat-card">
                <div class="label">Ending Balance</div>
                <div class="value negative">$13.34</div>
            </div>
            <div class="stat-card">
                <div class="label">Total P&L</div>
                <div class="value positive">+$0.00</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Trades</div>
                <div class="value neutral">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Win Rate</div>
                <div class="value neutral">0.0%</div>
            </div>
            <div class="stat-card">
                <div class="label">Wins / Losses</div>
                <div class="value neutral">0 / 0</div>
            </div>
            <div class="stat-card">
                <div class="label">Largest Win</div>
                <div class="value positive">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="label">Largest Loss</div>
                <div class="value negative">$0.00</div>
            </div>
        </div>
        
        <h2 style="color: #c9d1d9; margin-bottom: 15px;">Trade History</h2>
        <p>No trades in this session.</p>
    </div>
</body>
</html>
